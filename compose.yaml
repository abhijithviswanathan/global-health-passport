# Local synthetic PostgreSQL deployment. Not a production compliance configuration.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: passport
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/configure.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U passport -d passport']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./apps/backend
    env_file: .env
    environment:
      BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://database:5432/passport
      DATABASE_USER: passport
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DOCUMENT_STORAGE_PATH: /app/data/documents
      PHOTO_STORAGE_PATH: /app/data/photos
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - clinical_files:/app/data
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:5173:8080'
    depends_on: [api]
volumes:
  postgres_data:
  clinical_files:
