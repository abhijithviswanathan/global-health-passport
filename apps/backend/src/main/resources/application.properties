# Local defaults bind only to this computer. Deployment overrides must be intentional.
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
# The file database is relative to the backend working directory; preserve its generated password.
# Flyway migrations describe the schema. Add a new migration instead of editing applied SQL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/passport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# Cookies carry the server session. Clinical permissions are still checked for every request.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
# Upload bounds complement content validation and scanner/quarantine rules in DocumentService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
