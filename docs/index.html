<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Health Passport with four fictional patient stories. Interactive doctor and patient demo, appointments, care tasks, requests and reports."
    />
    <meta name="theme-color" content="#175c50" />
    <title>Health Passport · Interactive demo</title>
    <!-- Standalone GitHub Pages demo. Edit styles, fictional fixtures and view functions below.
     This file never connects to the Java API and does not share live application state. -->
    <style>
      :root {
        --bg: #f5f6f2;
        --paper: #fff;
        --ink: #233d3a;
        --muted: #627570;
        --line: #dce5de;
        --green: #175c50;
        --mint: #e8f2e9;
        --orange: #b36937;
        --shadow: 0 10px 35px #173a2910;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #c88536;
        outline-offset: 3px;
      }
      button:disabled {
        cursor: default;
      }
      a {
        color: var(--green);
      }
      button {
        color: inherit;
      }
      svg {
        width: 20px;
        height: 20px;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 36px;
        font-weight: 650;
        letter-spacing: -1.3px;
        line-height: 1.15;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
      }
      small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 700;
      }
      .layout {
        display: grid;
        grid-template-columns: 238px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--paper);
        border-right: 1px solid var(--line);
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        border: 0;
        background: none;
        padding: 0;
        color: var(--green);
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.5px;
      }
      .brandmark {
        width: 39px;
        height: 42px;
        background: var(--green);
        color: #fff;
        border-radius: 12px;
        display: grid;
        place-items: center;
      }
      .brandmark svg {
        width: 25px;
        height: 25px;
      }
      .brand small {
        display: block;
        font-size: 10px;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        font-weight: 500;
      }
      .side-label {
        padding: 0 14px;
        color: #74817d;
        margin-bottom: 14px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 12px 14px;
        min-height: 46px;
        border: 0;
        background: transparent;
        border-radius: 10px;
        text-align: left;
        color: var(--muted);
      }
      .nav button.active {
        background: var(--mint);
        color: var(--green);
        font-weight: 650;
      }
      .nav button:hover {
        background: #f0f4f0;
      }
      .sidebottom {
        margin-top: auto;
        padding: 18px 13px 0;
        border-top: 1px solid var(--line);
      }
      .demo-dot {
        width: 7px;
        height: 7px;
        background: #519c60;
        display: inline-block;
        border-radius: 50%;
        margin-right: 6px;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 88px;
        padding: 18px 40px;
        border-bottom: 1px solid var(--line);
        background: #fdfefbaa;
      }
      .breadcrumbs {
        font-size: 13px;
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--muted);
      }
      .tools {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .switch {
        display: flex;
        background: #e9ede6;
        padding: 4px;
        border-radius: 30px;
      }
      .switch button {
        border: 0;
        border-radius: 24px;
        padding: 9px 16px;
        background: transparent;
        font-size: 12px;
      }
      .switch button.selected {
        background: white;
        box-shadow: 0 1px 6px #24422b12;
        color: var(--green);
        font-weight: 650;
      }
      .avatar {
        height: 38px;
        width: 38px;
        border-radius: 50%;
        background: #dce9df;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--green);
      }
      .content {
        max-width: 1420px;
        margin: auto;
        padding: 30px 40px 45px;
      }
      .demo-notice {
        font-size: 12px;
        color: #607469;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 23px;
      }
      .textbutton {
        background: none;
        border: 0;
        padding: 5px 0;
        color: var(--green);
        text-decoration: underline;
        font-size: 12px;
      }
      .pagehead {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 24px;
      }
      .pagehead p {
        margin-top: 8px;
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 20px;
        font-size: 11px;
        background: white;
        white-space: nowrap;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(180px, 1fr);
        gap: 24px;
        background: var(--green);
        border-radius: 19px;
        color: #fff;
        padding: 31px 32px;
        position: relative;
        overflow: hidden;
      }
      .hero p {
        color: #c4d8ce;
        max-width: 440px;
        margin-top: 16px;
        font-size: 14px;
      }
      .hero .eyebrow {
        color: #c5dfca;
        margin-bottom: 12px;
      }
      .hero h1 {
        font-size: 39px;
      }
      .hero .primary {
        background: #e4f0c4;
        color: #294d36;
        border: 0;
        margin-top: 22px;
      }
      .hero-art {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        position: relative;
      }
      .orbit {
        height: 165px;
        width: 165px;
        border: 1px solid #70a38d;
        border-radius: 50%;
        display: grid;
        place-items: center;
        position: relative;
      }
      .orbit:before {
        content: "";
        position: absolute;
        inset: 20px;
        border: 1px solid #70a38d55;
        border-radius: 50%;
      }
      .orbit svg {
        width: 68px;
        height: 68px;
        stroke: #dfeebd;
        stroke-width: 1;
      }
      .mini {
        position: absolute;
        background: #f5f7e9;
        color: #294d36;
        border-radius: 12px;
        padding: 10px 14px;
        box-shadow: 0 8px 20px #08251d22;
        font-size: 12px;
        left: -40px;
        bottom: 0;
      }
      .mini strong {
        display: block;
        font-size: 22px;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 43px;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      .primary {
        color: white;
        border: 1px solid var(--green);
        background: var(--green);
      }
      .secondary {
        background: white;
        border: 1px solid var(--line);
      }
      .primary:hover {
        filter: brightness(1.08);
      }
      .secondary:hover {
        background: #eef4ed;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 21px 0 26px;
      }
      .stat {
        padding: 17px 20px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat strong {
        font-size: 26px;
        letter-spacing: -1px;
      }
      .stat p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .stat .symbol {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--mint);
        color: var(--green);
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 22px;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 23px;
        min-width: 0;
      }
      .panelhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 17px;
      }
      .panelhead h2 {
        font-size: 18px;
      }
      .panelhead p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .visit {
        display: grid;
        grid-template-columns: 51px 1fr auto;
        gap: 15px;
        align-items: center;
        padding: 17px 0;
        border-bottom: 1px solid #e8ede7;
      }
      .visit:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .time {
        font-size: 13px;
        font-weight: 650;
        color: var(--green);
        align-self: start;
        padding-top: 4px;
      }
      .personline {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .personline h3 {
        font-size: 14px;
      }
      .visit p {
        font-size: 12px;
        margin-top: 5px;
        color: var(--muted);
      }
      .visit .avatar {
        width: 30px;
        height: 30px;
        font-size: 10px;
        flex-shrink: 0;
      }
      .iconbutton {
        width: 35px;
        height: 35px;
        min-width: 35px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: white;
        display: grid;
        place-items: center;
      }
      .task {
        padding: 16px 0;
        border-bottom: 1px solid #e8ede7;
        display: flex;
        align-items: start;
        gap: 12px;
      }
      .task:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .task .check {
        width: 24px;
        height: 24px;
        min-width: 24px;
        border: 1px solid #b8ccbe;
        border-radius: 7px;
        background: #fff;
        display: grid;
        place-items: center;
        margin-top: 3px;
      }
      .task .check.done {
        background: #deeddd;
        color: #346344;
      }
      .task h3 {
        font-size: 13px;
      }
      .task p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .badge {
        font-size: 10px;
        padding: 4px 8px;
        border-radius: 5px;
        display: inline-block;
        background: #f6eedf;
        color: #8a5824;
        margin-top: 8px;
      }
      .badge.green {
        background: #e8f1e6;
        color: #427144;
      }
      .badge.blue {
        background: #e7f0f4;
        color: #446d7c;
      }
      .badge.gray {
        background: #eef0ed;
        color: #607166;
      }
      .below {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 24px;
        font-size: 11px;
        color: var(--muted);
      }
      .search {
        width: min(100%, 400px);
        border: 1px solid var(--line);
        background: white;
        border-radius: 9px;
        padding: 12px 16px;
        margin-bottom: 22px;
        min-height: 44px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .patient-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 24px;
        transition: box-shadow 0.2s;
      }
      .patient-card:hover {
        box-shadow: var(--shadow);
      }
      .patient-card .avatar {
        height: 46px;
        width: 46px;
        font-size: 15px;
      }
      .patient-card h2 {
        font-size: 18px;
      }
      .patient-card .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .patient-card .context {
        border-radius: 9px;
        background: #f3f6f0;
        padding: 15px;
        margin: 20px 0 16px;
        min-height: 103px;
      }
      .patient-card .context p {
        font-size: 13px;
        margin: 7px 0;
        color: #52665c;
      }
      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .tablewrap {
        overflow: auto;
      }
      .datatable {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      .datatable th {
        text-align: left;
        padding: 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        border-bottom: 1px solid var(--line);
        background: #f4f6f0;
      }
      .datatable td {
        padding: 17px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .datatable td small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
      }
      .datatable tr:last-child td {
        border-bottom: 0;
      }
      .datatable .badge {
        margin: 0;
      }
      .empty {
        padding: 30px;
        color: var(--muted);
        text-align: center;
        grid-column: 1/-1;
      }
      .report {
        background: white;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 25px;
      }
      .report-icon {
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        background: var(--mint);
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .report p {
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0 18px;
      }
      .strip {
        padding: 17px 20px;
        border-radius: 12px;
        background: #eaf0e4;
        margin-bottom: 22px;
        font-size: 13px;
      }
      .patientselect {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        background: white;
        max-width: 100%;
      }
      .vitals {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .vitals > div {
        padding: 13px;
        background: #f1f5ee;
        border-radius: 9px;
      }
      .vitals strong {
        display: block;
        font-size: 19px;
      }
      .vitals small {
        color: var(--muted);
      }
      .record {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .record p {
        font-size: 13px;
        line-height: 1.7;
        margin-top: 7px;
        color: #536860;
      }
      .record:last-child {
        border: 0;
      }
      .teamgrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .team-member {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }
      .team-member .avatar {
        margin-bottom: 12px;
      }
      .team-member p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      dialog {
        border: 0;
        border-radius: 18px;
        width: min(690px, calc(100vw - 28px));
        padding: 0;
        color: var(--ink);
        box-shadow: 0 25px 100px #183d3544;
        max-height: 90vh;
        background: white;
      }
      dialog::backdrop {
        background: #12372b77;
        backdrop-filter: blur(4px);
      }
      .dialoghead {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: white;
        padding: 23px 26px;
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      .dialoghead h2 {
        font-size: 20px;
      }
      .dialogbody {
        padding: 23px 26px;
      }
      .dialogbody > p {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .dialogbody h3 {
        margin: 17px 0 7px;
      }
      .dialogbody .primary {
        margin-top: 18px;
      }
      .provenance {
        font-size: 11px;
        background: #f5f6f0;
        padding: 13px;
        border-radius: 8px;
        margin-top: 20px;
        color: var(--muted);
      }
      #toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: #173f33;
        color: white;
        padding: 13px 20px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        font-size: 13px;
        max-width: calc(100% - 28px);
        z-index: 20;
        display: none;
      }
      .skip {
        position: absolute;
        top: -60px;
        left: 10px;
        background: white;
        padding: 10px;
        z-index: 100;
      }
      .skip:focus {
        top: 10px;
      }
      .mobile-brand {
        display: none;
      }
      .buttonrow {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      footer a {
        color: inherit;
      }
      button,
      .primary,
      .secondary {
        touch-action: manipulation;
      }
      @media (min-width: 1450px) {
        .content {
          padding-top: 36px;
        }
        .hero {
          padding: 38px;
        }
        .hero h1 {
          font-size: 44px;
        }
      }
      @media (max-width: 1050px) {
        .layout {
          grid-template-columns: 195px minmax(0, 1fr);
        }
        .sidebar {
          padding: 25px 12px;
        }
        .content {
          padding: 25px;
        }
        .topbar {
          padding: 17px 25px;
        }
        .stats {
          gap: 10px;
        }
        .stat {
          padding: 14px;
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .hero-art {
          padding-right: 0;
        }
        .orbit {
          width: 135px;
          height: 135px;
        }
        .mini {
          left: -22px;
        }
        .teamgrid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 720px) {
        h1 {
          font-size: 29px;
        }
        .layout {
          display: block;
        }
        .sidebar {
          position: static;
          height: auto;
          padding: 18px 18px 0;
          gap: 16px;
          border: 0;
        }
        .sidebar > .brand {
          display: none;
        }
        .side-label,
        .sidebottom {
          display: none;
        }
        .nav {
          flex-direction: row;
          overflow: auto;
          gap: 5px;
          padding-bottom: 13px;
        }
        .nav button {
          white-space: nowrap;
          padding: 10px 12px;
          font-size: 12px;
          min-height: 42px;
          gap: 6px;
        }
        .nav svg {
          width: 16px;
          height: 16px;
        }
        .topbar {
          padding: 15px 18px;
          min-height: 73px;
          border-bottom: 0;
          position: relative;
          order: -1;
        }
        .layout {
          display: flex;
          flex-direction: column;
        }
        .workspace {
          display: contents;
        }
        .topbar {
          order: -2;
          background: white;
        }
        .sidebar {
          order: -1;
          background: white;
          border-bottom: 1px solid var(--line);
        }
        .mobile-brand {
          display: flex;
          font-size: 15px;
        }
        .mobile-brand .brandmark {
          width: 32px;
          height: 35px;
          border-radius: 9px;
        }
        .mobile-brand small {
          font-size: 8px;
        }
        .breadcrumbs,
        .tools > .avatar {
          display: none;
        }
        .tools {
          gap: 0;
        }
        .switch button {
          font-size: 11px;
          padding: 8px 10px;
        }
        .content {
          padding: 23px 18px 30px;
          width: 100%;
        }
        .hero {
          grid-template-columns: 1fr;
          padding: 26px;
        }
        .hero h1 {
          font-size: 35px;
        }
        .hero-art {
          display: none;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .stat {
          padding: 14px 16px;

          '<div class="columns"><section class="panel"><h2 style="font-size:18px">Your story and next steps</h2><div class="record"><h3>Visit context</h3><p>' +
          p.history +
          '</p></div><div class="record"><h3>Reported allergies and intolerances</h3><p>' +
          p.allergy +
          '</p></div><div class="record"><h3>Follow-up plan</h3><p>' +
          p.plan +
          '</p></div></section><section class="panel"><h2 style="font-size:18px">Requests and reports</h2>' +
          orders
            .map((o, i) =>
              o.patient === selected
                ? '<div class="record"><h3>' +
                  o.name +
                  "</h3><p>" +
                  o.owner +
                  "</p>" +
                  badge(o.state) +
                  '<div style="margin-top:13px">' +
                  btn(
                    o.report === undefined ? "View request" : "Read report",
                    o.report === undefined ? "order" : "report",
                    o.report === undefined ? i : o.report,
                  ) +
                  "</div></div>"
                : "",
            )
            .join("") +
          '<div class="provenance">Demo perspective selection is not login or access authorization. The full application enforces patient permissions on its backend.</div></section></div>'
        );
      }
      // Central render pass synchronizes navigation, perspective controls and the active screen.
      function render() {
        const navs = [
          ["today", "Today", "today"],
          ["patients", "Patients", "people"],
          ["requests", "Requests", "request"],
          ["reports", "Reports", "report"],
          ["care", "Care team", "team"],
        ];
        document.querySelector("#nav").innerHTML = navs
          .map(
            (n) =>
              '<button data-action="navigate" data-id="' +
              n[0] +
              '" class="' +
              (role === "doctor" && view === n[0] ? "active" : "") +
              '"' +
              (role === "doctor" && view === n[0]
                ? ' aria-current="page"'
                : "") +
              ">" +
              svg(n[2]) +
              n[1] +
              "</button>",
          )
          .join("");
        document.querySelectorAll("[data-role]").forEach((b) => {
          b.classList.toggle("selected", b.dataset.role === role);
          b.setAttribute("aria-pressed", b.dataset.role === role);
        });
        document.querySelector("#crumb").textContent =
          role === "patient"
            ? "Patient perspective"
            : navs.find((n) => n[0] === view)[1];
        document.querySelector("#useravatar").textContent =
          role === "doctor" ? "DS" : people[selected].initials;
        document
          .querySelector("#useravatar")
          .setAttribute(
            "aria-label",
            role === "doctor"
              ? "Fictional doctor Dr Smith"
              : "Fictional patient " + people[selected].name,
          );
        screen.innerHTML =
          role === "patient"
            ? patientView()
            : { today, patients, requests: requestView, reports, care }[view]();
        document
          .querySelectorAll("[data-icon]")
          .forEach((e) => (e.innerHTML = svg(e.dataset.icon)));
      }
      // Reusable native dialog for charts, requests, reports and explanation text.
      function show(title, body) {
        document.querySelector("#dialog-title").textContent = title;
        document.querySelector("#dialog-body").innerHTML = body;
        if (!dialog.open) dialog.showModal();
      }
      // Assemble one fictional chart with linked sample orders and observation-date provenance.
      function chart(id) {
        const p = people[id];
        show(
          p.name + " · Patient chart",
          "<p>" +
            p.age +
            " years · " +
            p.job +
            " · ID " +
            p.healthId +
            "</p>" +
            vital(p) +
            '<div class="record"><h3>History and presenting concern</h3><p>' +
            p.history +
            '</p></div><div class="record"><h3>Allergy reconciliation</h3><p>' +
            p.allergy +
            '</p></div><div class="record"><h3>Plan</h3><p>' +
            p.plan +
            '</p></div><div class="provenance">All details are invented. Nurse intake observed 10 Sep 2026; entered 11 Sep 2026. These are historical example measurements, not current observations.</div><div class="buttonrow" style="margin-top:17px">' +
            orders
              .map((o, i) => (o.patient === id ? btn(o.name, "order", i) : ""))
              .join("") +
            "</div>",
        );
      }
      // Show hard-coded illustrative report content; no clinical interpretation service is called.
      function report(id) {
        show(
          (id ? "Chest examination" : "Complete blood count") +
            " · Alice Morgan",
          id
            ? '<span class="pill">Fictional imaging report</span><h3>Technique</h3><p>Fictional two-view chest examination. No actual X-ray or DICOM pixels are included.</p><h3>Findings</h3><p>No focal air-space opacity, pleural fluid or pneumothorax described in this invented narrative. Cardiomediastinal silhouette not enlarged.</p><h3>Sample impression</h3><p>No acute finding described in this fictional sample.</p><div class="provenance">Attested by Dr Ahmed · Reviewed by Dr Smith<br>Observed 10 Sep 2026 · Entered 11 Sep 2026<br>Demonstration only; not a real clinical interpretation.</div>'
            : '<span class="pill">Fictional laboratory report · EDTA whole blood</span><div class="vitals" style="grid-template-columns:repeat(3,1fr)"><div><strong>6.8</strong><small>WBC · ×10⁹/L</small></div><div><strong>13.2</strong><small>Haemoglobin · g/dL</small></div><div><strong>254</strong><small>Platelets · ×10⁹/L</small></div></div><p>These values are invented. No clinical reference range or diagnostic interpretation is asserted.</p><div class="provenance">Recorded by Technician Lee · Reviewed by Dr Smith<br>Observed 10 Sep 2026 · Entered 11 Sep 2026<br>Accession DEMO-CBC-ALICE-01</div>',
        );
      }
      function toast(message) {
        const el = document.querySelector("#toast");
        el.textContent = message;
        el.style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.style.display = "none"), 4500);
      }
      // Delegate button actions from rendered markup. Only the complete/reset actions change demo state.
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.role) {
          role = b.dataset.role;
          render();
          return;
        }
        const id = b.dataset.id;
        switch (b.dataset.action) {
          case "home":
            role = "doctor";
            view = "today";
            render();
            window.scrollTo(0, 0);
            break;
          case "navigate":
            role = "doctor";
            view = id;
            render();
            window.scrollTo(0, 0);
            break;
          case "chart":
            chart(Number(id));
            break;
          case "report":
            report(Number(id));
            break;
          case "order": {
            let o = orders[id];
            show(
              o.name + " · " + people[o.patient].name,
              badge(o.state) +
                "<h3>" +
                o.type +
                " request</h3><p>" +
                o.detail +
                '</p><div class="provenance">Owner: ' +
                o.owner +
                "<br>Fictional demonstration request. No order is sent to a real care provider.</div>" +
                (o.report === undefined
                  ? ""
                  : btn(
                      "Read the sample report",
                      "report",
                      o.report,
                      "primary",
                    )),
            );
            break;
          }
          case "complete":
            if (tasks[id].status === "Completed") {
              toast("This sample task is already complete.");
              break;
            }
            tasks[id].status = "Completed";
            render();
            toast(
              "Demo task completed in this browser session. No clinical record was changed.",
            );
            break;
          case "close":
            dialog.close();
            break;
          case "reset":
            tasks = structuredClone(taskSeed);
            selected = 0;
            search = "";
            role = "doctor";
            view = "today";
            render();
            toast("Demo reset to the original fictional examples.");
            break;
          case "about":
            show(
              "A working preview of the idea",
              '<p>Explore a day of care at fictional NorthStar Hospital. Switch between doctor and patient perspectives, read charts and reports, follow requests, and complete sample care tasks.</p><h3>What works in this preview</h3><p>Navigation, patient search, chart and report reading, perspective selection, and simulated task completion work entirely in your browser.</p><h3>What is not connected</h3><p>This GitHub Pages site has no authentication, backend database, uploads, live messaging or real clinical services. Reloading resets all changes. Do not enter real patient information.</p><h3>The full application</h3><p>The repository includes the Java backend, web and Expo clients, server-enforced consent and persistent workflows. Those services must be run or hosted separately.</p><p><a href="https://github.com/abhijithviswanathan/global-health-passport" target="_blank" rel="noopener">Read the project and local setup instructions ↗</a></p>',
            );
            break;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "patient-search") {
          search = e.target.value;
          document.querySelector("#patient-cards").innerHTML = patientCards();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "patient-select") {
          selected = Number(e.target.value);
          render();
        }
      });
      // Initial render. New views should be added to navigation and the render dispatch together.
      render();
    </script>
  </body>
</html>
