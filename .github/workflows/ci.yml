# Repository verification only. GitHub Pages uses its separate branch deployment.
# Backend, web and mobile jobs are independent; a green build does not imply native-device testing.
name: Verify application

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 21 and PostgreSQL workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: passport_test
          POSTGRES_USER: postgres
          # Disposable CI fixture only; never used by the application launcher.
          POSTGRES_PASSWORD: ephemeral-ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d passport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/passport_test
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: ephemeral-ci-database-only
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml
      - name: Verify backend and real PostgreSQL workflow
        run: ./mvnw -B --no-transfer-progress verify
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports
          path: apps/backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Verify demo, shared transport and workflow contracts
        run: node --test ../../scripts/tests/*.test.mjs
      - name: Lint public demo modules
        working-directory: .
        run: node apps/web/node_modules/eslint/bin/eslint.js --config scripts/quality/demo-eslint.config.mjs docs/demo
      - name: Lint shared boundaries
        working-directory: .
        run: node apps/web/node_modules/eslint/bin/eslint.js --config scripts/quality/shared-eslint.config.mjs apps/shared --max-warnings 0
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Test mobile behavior
        run: npm test
